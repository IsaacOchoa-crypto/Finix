# Redirección automática de HTTP (puerto 80) a HTTPS (puerto 443)
server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
}

# Servidor HTTPS (puerto 443)
server {
    listen 443 ssl;
    server_name localhost;

    # Cargar certificados locales generados
    ssl_certificate /etc/letsencrypt/nginx-selfsigned.crt;
    ssl_certificate_key /etc/letsencrypt/nginx-selfsigned.key;

    # Configuraciones de seguridad SSL básicas
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Redirección de la API al backend Express
    location /api {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Redirección al frontend Vite (React Router)
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
